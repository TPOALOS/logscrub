[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "logscrub"
version = "1.1.0"
description = "Redact secrets, emails, IPs, tokens and your own internal names from logs before sharing them (stdlib-only Python pipe filter)."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TPOALOS"}]
keywords = ["log-redaction", "privacy", "redaction", "pii"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/TPOALOS/logscrub"

[project.scripts]
logscrub = "logscrub:main"

[tool.setuptools]
py-modules = ["logscrub"]
